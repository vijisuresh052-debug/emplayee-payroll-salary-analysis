{% extends 'base.html' %}

{% block content %}
<section class="hero small">
    <div>
        <p class="eyebrow">Employee Management</p>
        <h1>Edit Employee Details</h1>
    </div>
</section>

<section class="panel edit-box">
    <form action="{{ url_for('edit_employee', employee_id=employee.Employee_ID) }}" method="post" class="employee-form">
        <div class="form-row">
            <label class="label">Employee ID</label>
            <input type="number" name="Employee_ID" value="{{ employee.Employee_ID }}" readonly>
        </div>

        <div class="form-row">
            <label class="label">Name</label>
            <input type="text" name="Name" value="{{ employee.Name }}" required>
        </div>

        <div class="form-row">
            <label class="label">Department</label>
            <input type="text" name="Department" value="{{ employee.Department }}" required>
        </div>

        <div class="form-row">
            <label class="label">Basic Salary</label>
            <input type="number" step="0.01" name="Basic_Salary" value="{{ employee.Basic_Salary }}" required>
        </div>

        <button type="submit">Save Changes</button>
    </form>
</section>
{% endblock %}
